# Publish cleepcli to PyPI (py3 wheel + sdist).
# Trigger: git tag vX.Y.Z

name: Publish to PyPI

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        # Required so PYPI_API_TOKEN is loaded (environment secret, not repo secret).
        environment: actions
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  # ubuntu-latest is 26.04+: CPython 3.9 builds are no longer published there
                  python-version: "3.12"

            - name: Install build tools
              run: python -m pip install --upgrade pip build twine

            - name: Build package
              run: |
                  python -m build
                  ls -la dist/

            - name: Publish to PyPI
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
              run: python -m twine upload dist/*
